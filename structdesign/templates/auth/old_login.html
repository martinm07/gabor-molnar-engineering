  <body>
    <div
      id="app"
      style="
        position: relative;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      "
    >
      <div
        class="grow max-w-3xl min-h-[50vh] mx-6 rounded-lg border-2 border-rock-300 p-4 pb-16 bg-background flex flex-col"
      >
        <h1 class="text-4xl text-rock-700 font-merry text-center py-3">
          Log into structural-design.eu
        </h1>
        <form
          method="post"
          class="text-xl text-rock-800 flex items-center flex-col my-auto"
        >
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <div
            class="flex items-center mb-6 max-md:flex-col max-md:items-start"
          >
            <label for="username" class="mr-3 max-md:mb-1">Username:</label>
            <input
              class="border-2 border-rock-300 rounded bg-rock-100 px-3 py-1 focus:bg-white focus:ring-4 ring-steel-300/50 outline-none font-mono"
              type="text"
              name="username"
              id="username"
              placeholder="username"
              required
            />
          </div>
          <div
            class="flex items-center w-full md:px-8 max-md:flex-col max-md:items-start"
          >
            <label for="password" class="mr-3 max-md:mb-1">Password:</label>
            <input
              class="border-2 border-rock-300 rounded bg-rock-100 px-3 py-1 focus:bg-white focus:ring-4 ring-steel-300/50 outline-none font-mono grow max-md:w-full"
              type="password"
              name="password"
              id="password"
              placeholder="pa55w0rd"
              required
            />
          </div>
          <div class="mt-8">
            <!-- <button
              class="bg-steel-100 border-4 border-steel-500 rounded-lg flex items-center px-4 py-2 text-xl font-bold text-steel-600 hover:bg-steel-200 hover:text-steel-700 transition-colors active:ring-4 ring-steel-300/50 active:translate-y-1"
              >Log in<ArrowRightIcon class="ml-1 text-2xl" weight="bold" /></button
            > -->
            <button
              class="text-xl font-mono border-2 border-steel-200 bg-steel-50 px-4 py-2 rounded-lg text-steel-800 hover:bg-steel-100 active:translate-y-1 active:bg-steel-200 focus:ring-4 ring-steel-100 [word-spacing:-4px]"
            >
              Log in<ArrowRightIcon class="inline-block ml-2 text-2xl" />
            </button>
          </div>
        </form>
        {% for message in get_flashed_messages() %}
        <div class="font-bold text-red-500">{{ message }}</div>
        {% endfor %}
      </div>
    </div>
    <input id="flask-server" type="hidden" value="%VITE_DEV_FLASK_SERVER%" />
    <script>
      globalThis.jinjaParsed = false;
      globalThis.urlRoot = document.getElementById("flask-server").value;
      try {
        if (!Number.parseInt("{{ 1 }}"))
          throw new Error("Jinja wasn't parsed.");
        globalThis.jinjaParsed = true;
        globalThis.urlRoot =
          "{{ url_for(request.endpoint, id=document_or_component_id).split('/')[0] + '/' }}";

        globalThis.csrfToken = "{{ csrf_token() }}";
      } catch {}

      console.log(JSON.parse(`{{ get_flashed_messages()|tojson }}`));
    </script>
