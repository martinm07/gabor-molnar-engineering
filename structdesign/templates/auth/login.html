<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="static/shared/img/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="static/shared/img/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="static/shared/img/favicon-16x16.png"
    />
    <link rel="manifest" href="static/shared/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log into structural-design.eu</title>
    <script type="module" crossorigin src="/static/auth/js/login-8hmvdnzx.js"></script>
    <link rel="modulepreload" crossorigin href="/static/shared/js/svelte-CkzmYXov.js">
    <link rel="modulepreload" crossorigin href="/static/shared/js/transitions-BRQzYLhQ.js">
    <link rel="modulepreload" crossorigin href="/static/shared/js/context-DEf1DyiQ.js">
    <link rel="modulepreload" crossorigin href="/static/shared/js/ArrowRightIcon-DeGXn6Nv.js">
    <link rel="stylesheet" crossorigin href="/static/shared/css/tailwindinit.css">
  </head>
  <body>
    <div
      id="app"
      style="
        position: relative;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      "
    ></div>
    <input id="flask-server" type="hidden" value="http://127.0.0.1:5000" />
    <script>
      globalThis.jinjaParsed = false;
      globalThis.urlRoot = document.getElementById("flask-server").value;
      try {
        if (!Number.parseInt("{{ 1 }}"))
          throw new Error("Jinja wasn't parsed.");
        globalThis.jinjaParsed = true;
        globalThis.urlRoot =
          "{{ url_for(request.endpoint, id=document_or_component_id).split('/')[0] + '/' }}";

        globalThis.csrfToken = "{{ csrf_token() }}";

        globalThis.flashedMessages = JSON.parse(
          `{{ get_flashed_messages()|tojson }}`,
        );
      } catch {}
    </script>

  </body>
</html>
