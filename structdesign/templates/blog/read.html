<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cog1-svgrepo-com.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <script
      type="module"
      crossorigin
      src="/static/blog/js/read-CoMw5o6N.js"
    ></script>
    <link
      rel="modulepreload"
      crossorigin
      href="/static/shared/js/svelte-Zn4dHZ_B.js"
    />
    <link
      rel="modulepreload"
      crossorigin
      href="/static/shared/js/this-CYvKrGOR.js"
    />
    <link
      rel="modulepreload"
      crossorigin
      href="/static/shared/js/await-BU4qrKyR.js"
    />
    <link
      rel="stylesheet"
      crossorigin
      href="/static/shared/css/tailwindinit.css"
    />
    <link
      rel="stylesheet"
      crossorigin
      href="/static/blog/css/read-CS2pPu5R.css"
    />
  </head>
  <body>
    <div id="app" style="position: relative"></div>
    <input id="flask-server" type="hidden" value="http://127.0.0.1:5000" />
    <script>
      globalThis.jinjaParsed = false;
      globalThis.urlRoot = document.getElementById("flask-server").value;
      try {
        if (!Number.parseInt("{{ 1 }}"))
          throw new Error("Jinja wasn't parsed.");
        globalThis.jinjaParsed = true;
        globalThis.urlRoot = "/";

        globalThis.csrfToken = "{{ csrf_token() }}";

        globalThis.blogreadID = "{{ id }}";
        globalThis.blogreadTitle = {{ title|tojson }};
        globalThis.blogreadDesc = {{ description|tojson }};
        globalThis.blogreadBody = {{ body|tojson }};
      } catch {}
    </script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
