upstream kamal_proxy {
  # "kamal-proxy" is resolved using DNS in the network created by Docker, allowing containers to talk to each other
  # You can run `docker network ls` and `docker network inspect kamal` to see that the Kamal proxy indeed has the name `kamal-proxy`
  #  and that all the containers are part of this same Docker network (called "kamal"), which was set up automatically by Kamal
  # server kamal-proxy:8080;
  server gabor-molnar-engineering-go-away:8080;
}

### This stuff is automatically included by our jonasal/nginx-certbot Docker image
# server {
#   listen 80;
#   listen [::]:80;
#
#   server_name structural-design.eu www.structural-design.eu;
#   server_tokens off;
#
#   location /.well-known/acme-challenge/ {
#     root /var/www/certbot;
#   }
#
#   location / {
#       return 301 https://structural-design.eu$request_uri;
#   }
# }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
  # https://nginx.org/en/docs/http/ngx_http_core_module.html#listen
  listen 443 default_server ssl http2;
  listen [::]:443 ssl http2;

  server_name structural-design.eu www.structural-design.eu;

  # Load the certificate files
  # The Docker image automatically adds domains to TLS certificates by automatically analysing our .conf files,
  #  and grouping all domains under the same "certificate name" defined here (i.e. "structdesign"),
  #  so in the end it should create a single request like: `certbot --cert-name "structdesign" ... -d structural-design.eu -d www.structural-design.eu`
  #  https://github.com/JonasAlfredsson/docker-nginx-certbot/blob/master/docs/good_to_know.md#how-the-script-add-domain-names-to-certificate-requests
  ssl_certificate         /etc/letsencrypt/live/structdesign/fullchain.pem;
  ssl_certificate_key     /etc/letsencrypt/live/structdesign/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/structdesign/chain.pem;

  # Load the Diffie-Hellman parameter.
  ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

  location / {
    # Note that we're passing this to the "named group of servers" we defined above
    #  https://nginx.org/en/docs/http/load_balancing.html
   	proxy_pass http://kamal_proxy;

    # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_http_version
    # https://www.digitalocean.com/community/tutorials/http-1-1-vs-http-2-what-s-the-difference
    proxy_http_version 2;

    # The default value of this header (https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_set_header)
    #  that NGINX sets is $proxy_host, which in this case would be "kamal-proxy"; that DNS name used by the Docker internal network-
    #  which is obviously not what we want; we want host to be the "domain name" of the server; what the user types in i.e. structural-design.eu
    # https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Host
    proxy_set_header Host $host;
    # This header is a "nginx-specific" convention (doesn't have an MDN page or anything); should just refer to the IP address of the original client
    #  (not by NGINX by default).
    proxy_set_header X-Real-IP $remote_addr;
    # https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/X-Forwarded-For
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/X-Forwarded-Proto
    proxy_set_header X-Forwarded-Proto $scheme;
    # These are apparently useful for enabling WebSockets through the proxy; currently useless to us (as we're not using WebSockets anywhere),
    #  but not harmful to keep around.

    # request header "Connection" is not valid in HTTP/2
    # https://stackoverflow.com/questions/70403584/why-do-http-2-clients-reject-requests-containing-the-connection-header

    # proxy_set_header Upgrade $http_upgrade;
    # proxy_set_header Connection "upgrade";
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name stats.structural-design.eu;

  ssl_certificate         /etc/letsencrypt/live/structdesign/fullchain.pem;
  ssl_certificate_key     /etc/letsencrypt/live/structdesign/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/structdesign/chain.pem;

  ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

  root /var/www/goaccess;

  auth_basic           "Restricted Content";
  auth_basic_user_file /etc/nginx/htpasswd;

  location / {
    try_files /index.html =404;
  }

  location /test {
    return 200 "Hello, world!";
  }

  location /ws {
    proxy_pass http://gabor-molnar-engineering-goaccess:7890;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 7d;
  }
}
