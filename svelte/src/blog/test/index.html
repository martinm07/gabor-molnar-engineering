<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="static/shared/img/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="static/shared/img/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="static/shared/img/favicon-16x16.png"
    />
    <link rel="manifest" href="static/shared/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MutationObserver Synchronicity Test</title>
  </head>
  <body>
    <div id="app" style="position: relative"></div>
    <input id="flask-server" type="hidden" value="%VITE_DEV_FLASK_SERVER%" />
    <script>
      globalThis.jinjaParsed = false;
      globalThis.urlRoot = document.getElementById("flask-server").value;
      try {
        if (!Number.parseInt("{{ 1 }}"))
          throw new Error("Jinja wasn't parsed.");
        globalThis.jinjaParsed = true;
        globalThis.urlRoot =
          "{{ url_for(request.endpoint).split('/')[0] + '/' }}";

        globalThis.csrfToken = "{{ csrf_token() }}";

        globalThis.blogreadID = "{{ id }}";
        globalThis.blogreadTitle = "{{ title }}";
        globalThis.blogreadDesc = "{{ description }}";
        globalThis.blogreadBody = "{{ body }}";
      } catch {}
    </script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
